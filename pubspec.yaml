name: flutter_application_1
description: "PetCare — Aplikasi Mobile All-in-One untuk Pemilik Hewan Peliharaan"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

# ============================================
# DEPENDENCIES
# ============================================
dependencies:
  flutter:
    sdk: flutter

  # ------------------------------------------
  # Icons
  # ------------------------------------------
  cupertino_icons: ^1.0.8

  # ------------------------------------------
  # State Management & Routing
  # ------------------------------------------
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  # ------------------------------------------
  # Networking (REST API)
  # ------------------------------------------
  http: ^1.2.2

  # ------------------------------------------
  # Storage (Local & Secure)
  # ------------------------------------------
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6

  # ------------------------------------------
  # UI & Media
  # ------------------------------------------
  google_fonts: ^9.0.0
  image_picker: ^1.2.4

  # ------------------------------------------
  # Notifications
  # ------------------------------------------
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

  # ------------------------------------------
  # Utils
  # ------------------------------------------
  intl: ^0.20.3

# ============================================
# DEV DEPENDENCIES
# ============================================
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# ============================================
# FLUTTER CONFIG
# ============================================
flutter:
  uses-material-design: true

  # ------------------------------------------
  # Assets
  # ------------------------------------------
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/

  # ------------------------------------------
  # Fonts (Optional — kalau mau bundle Poppins manual)
  # ------------------------------------------
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700